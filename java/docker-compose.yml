services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/app
      - m2-repo:/root/.m2
      - target:/app/target
      - data:/app/data
    environment:
      - DB_PATH=/app/data/jobs.db
      - APP_PORT=7000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7000/"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 90s
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "8082:80"
    volumes:
      - .:/app:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

volumes:
  m2-repo:
  target:
  data:
