server {
    listen 80;
    server_name localhost;
    root /app/public;

    # Do not expose Java source files directly
    location ~ \.java$ {
        return 403;
    }

    error_page 502 /starting-up.html;
    location = /starting-up.html { internal; }

    location / {
        try_files $uri @app;
    }

    location @app {
        proxy_pass http://app:7000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
    }
}
