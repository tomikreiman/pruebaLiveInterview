server {
    listen 80;
    server_name localhost;
    root /var/www/html/public;

    # Do not expose Python source files directly
    location ~ \.py$ {
        return 403;
    }

    error_page 502 /starting-up.html;
    location = /starting-up.html { internal; }

    location / {
        try_files $uri @app;
    }

    location @app {
        include uwsgi_params;
        uwsgi_pass app:5000;
    }
}
