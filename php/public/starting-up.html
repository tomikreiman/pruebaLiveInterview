<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="refresh" content="3" />
  <title>Starting up…</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 480px; margin: 6rem auto; padding: 0 1rem; text-align: center; color: #333; }
    h1 { font-size: 1.4rem; margin-bottom: 0.5rem; }
    p  { color: #666; }
    .spinner { width: 2rem; height: 2rem; border: 3px solid #ddd; border-top-color: #555; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 1.5rem auto; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <h1>Server is starting up</h1>
  <p>Installing dependencies — this only happens on the first run.<br>The page will refresh automatically.</p>
</body>
</html>
